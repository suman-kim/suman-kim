# 기술 블로그(Tistory) 최신 글 5개를 카드 이미지로 그려 README의 '최근 글'에 매일 채워 넣습니다.
name: Latest blog posts

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 00:00 KST
  workflow_dispatch:        # Actions 탭에서 바로 실행

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Draw blog cards
        env:
          BLOG_FEED: https://ssirioops.tistory.com/rss
          BLOG_MAX: 5
        run: node scripts/blog.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/blog-*.svg
          git diff --cached --quiet || git commit -m "chore: 최신 블로그 글 갱신"
          git pull --rebase --autostash
          git push
