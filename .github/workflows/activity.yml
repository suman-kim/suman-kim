# 깃허브 활동 통계 카드(assets/activity-*.svg)를 매일 다시 그립니다.
# 비공개 저장소까지 반영하려면 Secrets에 STATS_TOKEN(클래식 PAT: repo, read:user)을 추가하세요.
name: Activity card

on:
  schedule:
    - cron: "30 15 * * *"   # 매일 00:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw activity card
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/activity.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg
          git diff --cached --quiet || git commit -m "chore: 활동 통계 카드 갱신"
          git pull --rebase --autostash
          git push
