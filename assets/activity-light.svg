<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="GitHub 활동 — 최근 1년 기여 "><style>text{font-family:Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', -apple-system, 'Segoe UI', sans-serif}.m{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}.cell{opacity:0;animation:in .5s ease forwards}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes in{to{opacity:1}}@media (prefers-reduced-motion:reduce){.up,.cell{animation:none;opacity:1}}</style><defs><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#E6E6EA"/></pattern><linearGradient id="gf" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".22" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".78" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient><clipPath id="c"><rect width="1280" height="520" rx="24"/></clipPath></defs><g clip-path="url(#c)"><rect width="1280" height="520" fill="#FFFFFF"/><rect width="1280" height="520" fill="url(#grid)" opacity=".5"/><rect width="1280" height="520" fill="url(#gf)"/></g><rect x=".5" y=".5" width="1279" height="519" rx="23.5" fill="none" stroke="#E6E6EA"/><g class="up"><rect x="64" y="70" width="28" height="1.5" fill="#2B47E8"/><text class="m" x="104" y="77" font-size="16" letter-spacing="2.9" fill="#2B47E8">05 · ACTIVITY</text><text class="m" x="1216" y="77" font-size="15" letter-spacing="1.8" fill="#5C5E66" text-anchor="end">첫 실행 대기 중</text><text x="62" y="144" font-size="50" font-weight="800" letter-spacing="-2" fill="#0E0F12">최근 1년의 기록</text></g><text x="64" y="300" font-size="22" fill="#5C5E66">GitHub Actions가 처음 실행되면 활동 통계가 여기에 그려집니다.</text></svg>